<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vika's Portfolio - Shopify Specialist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #FAF8F5;
            --text: #1A1A1A;
            --accent: #a2d2ff;
            --brown: #9c6644;
            --brown-dark: #8a5a3a;
            --secondary: #6B6B6B;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--brown);
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 40px;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            color: #a2d2ff;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 300;
            color: #a2d2ff;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .cta-button {
            margin-top: 50px;
            padding: 20px 60px;
            background: var(--brown);
            color: #FAF8F5;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            background: var(--brown-dark);
            box-shadow: 0 10px 30px rgba(156, 102, 68, 0.3);
        }

        /* Footer */
        footer {
            padding: 30px 60px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--secondary);
        }

        /* Mobile */
        @media (max-width: 768px) {
            nav {
                padding: 20px 30px;
                flex-direction: column;
                gap: 20px;
            }
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
            footer {
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Vika.</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="shopify.html">Shopify</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1 class="hero-title">Vika's<br>Portfolio</h1>
        <p class="hero-subtitle">Shopify Specialist</p>
        <a href="portfolio.html" class="cta-button">Let's Start</a>
    </section>

    <footer>
        <p>&copy; 2026 Vika. All rights reserved.</p>
    </footer>
</body>
</html>
